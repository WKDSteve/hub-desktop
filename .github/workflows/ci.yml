# CI of hub-desktop.
#
# One pipeline, two kinds of runner. Windows is the only platform built and tested here.
#
# - push to main: the self-hosted Windows runner of the maintainer (its stable toolchain, node, pnpm, python and the
#   supply-chain tools on PATH). The runner guard of that machine refuses a push run until the maintainer has released
#   the commit; without a running runner a push stays "Queued" (no red mark, discarded after 24 h).
# - every other event (pull_request, forks included): windows-latest, a throwaway VM with a read-only token and no
#   secrets. A pull request never runs on the self-hosted runner: it would run its own code on the maintainer's
#   machine. Every job picks its runner with the same matrix expression; keep the four in step.
#
# A fork can edit this file in its pull request (e.g. `runs-on: self-hosted`). The repository therefore requires
# approval before a workflow of an outside contributor runs; never approve a pull request that touches `.github/`.
# There is no `pull_request_target` on purpose.
#
# The shell comes from the matrix: `bash` is the WSL launcher on the self-hosted machine, so Git Bash is named there
# explicitly, in 8.3 form because the shell string is split at spaces; on windows-latest `bash` is Git Bash.
#
# Tools are expected on the PATH and not pinned here (cargo, clippy, rustfmt, pnpm, node, python). The floating
# `stable` toolchain is a known choice: a new stable release can turn clippy red without a code change, and the answer
# is then to change the code, not to pin the toolchain.
#
# The sources are public and fetched without credentials (appkit through Cargo and pnpm).

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # On main a run that started is finished, so that busy days still give green runs (and rolling builds); GitHub keeps
  # one newer run waiting and drops the older waiting ones. Other refs still cancel the run they replace.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # The interface is part of the binary, so it is built first and the Rust checks run on a binary that has it.
  rust:
    name: rust (${{ matrix.leg }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include: ${{ fromJSON(github.event_name == 'push' && '[{"leg":"self-hosted","runs-on":["self-hosted","windows"],"shell":"C:\\PROGRA~1\\Git\\bin\\bash.exe --noprofile --norc -e -o pipefail {0}"}]' || '[{"leg":"windows-latest","runs-on":"windows-latest","shell":"bash --noprofile --norc -e -o pipefail {0}"}]') }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    timeout-minutes: 40
    steps:
      # Actions are pinned by commit; the comment names the tag.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false
      - name: pnpm (the hosted runner has node, not pnpm)
        if: matrix.leg == 'windows-latest'
        run: npm install --global pnpm@10
      - run: cargo --version && node --version && pnpm --version
      - name: Build the interface
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # A temp dir of this job, empty at the start: the shared temp dir of the runner holds the leftovers of
      # every earlier run, so a count there is never zero. TEMP and TMP are read on Windows, TMPDIR elsewhere.
      # `New-Item` fails when the folder is there already, so "empty at the start" is checked, not assumed.
      - name: Temp dir of this job
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "job-temp-$env:GITHUB_JOB-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $dir -ErrorAction Stop | Out-Null
          "TEMP=$dir", "TMP=$dir", "TMPDIR=$dir", "JOB_TEMP=$dir" | Add-Content -Path $env:GITHUB_ENV
      - run: cargo test --workspace --locked
      # No test left anything in the temp dir of this job (a test makes its folder with `Scratch`, which removes it
      # also after a failure). Strict: whatever name a test gave its folder counts.
      - name: The tests left nothing in the temp dir
        run: python tools/check-temp-leftovers.py --dir "$JOB_TEMP" --strict
      # The browser tests: the binary and the fake program (`cargo build --workspace`), the system's Chrome, a hub of
      # its own for every test against a machine that exists only for it (ui/e2e/fixture.ts), axe in light and dark.
      - run: cargo build --workspace --locked
      # The install script of the release-kit (the one the pinned appkit holds) and scripts/uninstall.* against this
      # build (NREL-12, as tasks-desktop does): in a folder of their own in the temp dir, the login entry and the link
      # of the runner are left alone, nothing is downloaded. Each script removes its folder and fails when it cannot.
      - name: Install and uninstall scripts (PowerShell and sh)
        run: |
          pwsh -NoProfile -File scripts/test-install.ps1 target/debug/hub-desktop.exe
          sh scripts/test-install.sh target/debug/hub-desktop.exe
      # And none of their folders (hub-desktop-test-install-* and .*) stayed, also after a run that was cut short. Not
      # strict: the child PowerShells may leave files of their own there.
      - name: The install scripts left nothing in the temp dir
        run: python tools/check-temp-leftovers.py --dir "$JOB_TEMP" --prefix hub-desktop-test-install
      - name: Browser tests (Playwright, axe)
        working-directory: ui
        run: pnpm e2e
      # The web variant (hub.html): the file is built, then opened from disk in Chrome with the requests counted
      # (ui/e2e-web/); nothing of it is published here (web.yml does that on a tag).
      - name: Web variant (one file, from disk)
        working-directory: ui
        run: |
          pnpm web:test
          pnpm web:build
          pnpm web:e2e
      # The test sheets (TESTS/sheets, .testing.lua) at a fixed version of testing.nvim; --strict: a sheet that could
      # not run is red here. The sheet's own build finds the interface and the binary built above. Only on the
      # maintainer's runner: nvim comes from its PATH, the hosted VM has none.
      - if: matrix.leg == 'self-hosted'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          repository: WKDSteve/testing.nvim
          ref: 10dcc98a63d41a2870572cd81e14c4ab2ca548ee
          path: .deps/testing.nvim
          persist-credentials: false
      - if: matrix.leg == 'self-hosted'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          repository: WKDSteve/lib.nvim
          ref: 37bf8bd87858ca84b26cf271605fab0679ddaddb
          path: .deps/lib.nvim
          persist-credentials: false
      - name: Test sheets (browser)
        if: matrix.leg == 'self-hosted'
        run: nvim -n -i NONE --headless -u NONE -l .deps/testing.nvim/scripts/testing.lua sheets run --all --root . --engine browser --strict
        env:
          LIB_NVIM_DIR: ${{ github.workspace }}/.deps/lib.nvim
      # A failed browser test leaves its trace (network, DOM, console) to read instead of a guess.
      - name: Traces of failed browser tests
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (node24)
        with:
          name: playwright-traces
          path: ui/test-results
          if-no-files-found: ignore
          retention-days: 14

  ui:
    name: ui (${{ matrix.leg }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include: ${{ fromJSON(github.event_name == 'push' && '[{"leg":"self-hosted","runs-on":["self-hosted","windows"],"shell":"C:\\PROGRA~1\\Git\\bin\\bash.exe --noprofile --norc -e -o pipefail {0}"}]' || '[{"leg":"windows-latest","runs-on":"windows-latest","shell":"bash --noprofile --norc -e -o pipefail {0}"}]') }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
        working-directory: ui
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false
      - name: pnpm (the hosted runner has node, not pnpm)
        if: matrix.leg == 'windows-latest'
        run: npm install --global pnpm@10
      # Which pnpm the job finds: a self-hosted job once ended with exit 127 right after a complete install
      # (2026-11-12, run 43255349683; the rerun was green), and that line is what a next case needs.
      - name: pnpm (which one)
        run: |
          command -v pnpm || { echo "::error::pnpm is not on the PATH of this job: $PATH"; exit 127; }
          pnpm --version
      # The lockfile is the truth; the age and trust policy are in ui/pnpm-workspace.yaml.
      - run: |
          code=0
          pnpm install --frozen-lockfile || code=$?
          if [ "$code" -ne 0 ]; then
            echo "::error::pnpm install ended with exit $code ($(command -v pnpm || echo 'pnpm not found'))"
          fi
          exit "$code"
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --audit-level high

  # The supply chain: advisories, licenses, sources, the age of every crate, and the appkit pin. The tools are on the
  # maintainer's runner; a pull request does not wait for a compile of them.
  supply:
    name: supply chain (${{ matrix.leg }})
    if: github.event_name == 'push'
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include: ${{ fromJSON(github.event_name == 'push' && '[{"leg":"self-hosted","runs-on":["self-hosted","windows"],"shell":"C:\\PROGRA~1\\Git\\bin\\bash.exe --noprofile --norc -e -o pipefail {0}"}]' || '[{"leg":"windows-latest","runs-on":"windows-latest","shell":"bash --noprofile --norc -e -o pipefail {0}"}]') }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false
      - run: cargo audit
      - run: cargo deny check
      # No crate version younger than a week (a hijacked release is caught within hours, usually).
      - run: python tools/check-lock-age.py --min-days 7
      # appkit is the one git source: the commit Cargo.lock pins must be the one its tag names now.
      - run: python tools/check-appkit-pin.py

  # A control or invisible character in a tracked text file (a backspace in a path, a bidirectional override in
  # source) is refused; the tools test themselves.
  hygiene:
    name: hygiene (${{ matrix.leg }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include: ${{ fromJSON(github.event_name == 'push' && '[{"leg":"self-hosted","runs-on":["self-hosted","windows"],"shell":"C:\\PROGRA~1\\Git\\bin\\bash.exe --noprofile --norc -e -o pipefail {0}"}]' || '[{"leg":"windows-latest","runs-on":"windows-latest","shell":"bash --noprofile --norc -e -o pipefail {0}"}]') }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false
      - run: python -m unittest discover -s tools -p "test_*.py"
      - run: python tools/check-control-chars.py
      # The icons of the other apps are what is pinned; offline, an owner may be private (rule APP-11).
      - run: python tools/sync-app-icons.py
      # A colour the CSS of the page states is a token of appkit-ui (the same check runs in appkit).
      - run: python tools/check-color-literals.py --tokens ui/src/palette.css
      # The shell scripts of the repository: ShellCheck is on the maintainer's runner (`scoop install shellcheck`).
      - name: ShellCheck
        if: github.event_name == 'push'
        run: shellcheck scripts/*.sh
